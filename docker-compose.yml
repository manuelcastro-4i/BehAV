services:
  # Go2 Robot Simulator with Gazebo Harmonic
  # Runs headless by default. Set ENABLE_VNC=true for browser GUI at http://localhost:6080
  go2_sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.go2_sim
    container_name: go2_simulator
    environment:
      - ENABLE_VNC=${ENABLE_VNC:-false}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    ports:
      - "6080:6080"
    networks:
      - ros2_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, compute, utility]
    stdin_open: true
    tty: true
    # Healthcheck to verify simulator is ready
    healthcheck:
      test: ["CMD", "bash", "-c", "source /opt/ros/jazzy/setup.bash && ros2 topic list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # BehAV Navigation Planner
  behav:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: behav_planner
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    # BehAV planner with topic remapping for Go2 simulator
    command: >
      python3 /app/planning/behav-planner.py
      --ros-args
      -p goal_radius:=5.0
      -p goal_theta:=0.0
      -p goal_delta:=0.0
      -p publish_to_motors:=true
      -p camera_fx:=554.25
      -p camera_fy:=554.25
      -p camera_cx:=320.0
      -p camera_cy:=240.0
      -p camera_height:=0.35
      --remap /odom_lidar:=/robot1/odom
      --remap /camera/color/image_raw:=/robot1/camera/image_raw
      --remap /mcu/command/manual_twist:=/robot1/cmd_vel
      --remap /scan:=/robot1/scan

  # Landmark Detector (optional, run separately)
  landmark_detector:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: landmark_detector
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - ./landmark-tracking/Images:/app/landmark-tracking/Images:ro
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    profiles:
      - landmark  # Only starts with --profile landmark
    command: >
      python3 /app/landmark-tracking/landmark_detector_ROS2.py
      --ros-args
      -p fastsam_model_path:=/app/models/FastSAM-x.pt
      -p image_topic:=/robot1/camera/image_raw

  # Instruction Decomposition - Lightweight test service (no ROS2, no GPU)
  # Usage:
  #   docker-compose --profile test run --rm instruction_decomposition --help
  #   docker-compose --profile test run --rm instruction_decomposition --demo
  #   docker-compose --profile test run --rm instruction_decomposition -i
  #   docker-compose --profile test run --rm instruction_decomposition -I "Your instruction"
  instruction_decomposition:
    image: python:3.10-slim
    container_name: instruction_decomposition
    working_dir: /app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./instruction-decomposition:/app/instruction-decomposition:ro
    profiles:
      - test  # Only starts with --profile test
    stdin_open: true   # Required for interactive mode
    tty: true          # Required for interactive mode
    entrypoint:
      - bash
      - -c
      - |
        pip install --quiet openai numpy 2>/dev/null
        exec python /app/instruction-decomposition/GPT4o/instruction-to-behavioral-costs.py "$@"
      - --
    command: ["--help"]

  # Landmark Detection - Standalone test service (CPU version for testing, no ROS2)
  # Note: For production with GPU, use the behav service or modify to use CUDA image
  # Usage:
  #   docker-compose --profile test run --rm landmark_test --help
  #   docker-compose --profile test run --rm landmark_test --demo
  #   docker-compose --profile test run --rm landmark_test -g Images/Testudo/Ground_truth.webp -t Images/Testudo/1.jpg
  landmark_test:
    build:
      context: .
      dockerfile: docker/Dockerfile.landmark
    container_name: landmark_test
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./models:/app/models:ro
      - ./landmark-tracking/Images:/app/landmark-tracking/Images:ro
      - ./output:/app/Image_plots
    profiles:
      - test
    stdin_open: true
    tty: true
    entrypoint:
      - python3
      - /app/landmark-tracking/landmarkdetector_fastsam.py
    command: ["--help"]

networks:
  ros2_net:
    driver: bridge
