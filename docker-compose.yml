services:
  # Go2 Robot Simulator with Gazebo Harmonic
  # Runs headless by default. Set ENABLE_VNC=true for browser GUI at http://localhost:6080
  go2_sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.go2_sim
    container_name: go2_simulator
    environment:
      - ENABLE_VNC=${ENABLE_VNC:-false}
      # Isolated Jazzy domain — must NOT match Humble containers (0)
      # This prevents Humble DDS from polluting Jazzy's type hash resolution,
      # which was causing shared_bridge_writer to receive no odom data.
      - ROS_DOMAIN_ID=99
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # On Linux with a real display: set DISPLAY to open Gazebo GUI locally.
      # On headless/Windows: keep software OpenGL so it doesn't SIGABRT.
      - DISPLAY=${DISPLAY:-:0}
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
      - MESA_GL_VERSION_OVERRIDE=3.3
    ports:
      - "6080:6080"
    networks:
      - ros2_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, compute, utility]
    volumes:
      - ./docker/sim_adapters.py:/app/sim_adapters.py:ro
      - ./docker/gz_pose_bridge.yaml:/app/gz_pose_bridge.yaml:ro
      - ./docker/go2_sim_start.sh:/app/go2_sim_start.sh:ro
      - ./docker/shared_bridge_writer.py:/app/shared_bridge_writer.py:ro
      # Patched xacro: adds OdometryPublisher + VelocityControl plugins (no rebuild needed)
      # Must be mounted at the INSTALLED path (used by xacro $(find go2_description))
      - ./docker/go2_gazebo.xacro:/app/go2_sim/install/go2_description/share/go2_description/xacro/gazebo.xacro:ro
      # Demo world: asphalt path, grass, obstacles, goal marker, trees
      - ./docker/behav_demo.world:/app/go2_sim/install/gazebo_sim/share/gazebo_sim/world/empty.world:ro
      # Patched launch: removes rviz2 which crashes headless (SIGABRT) and kills everything
      - ./docker/launch_sim.launch.py:/app/go2_sim/install/gazebo_sim/share/gazebo_sim/launch/launch_sim.launch.py:ro
      - shared_bridge:/shared
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    command: ["bash", "/app/go2_sim_start.sh"]
    # Healthcheck to verify simulator is ready
    healthcheck:
      test: ["CMD", "bash", "-c", "source /opt/ros/jazzy/setup.bash && ros2 topic list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # BehAV Navigation Planner
  behav:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: behav_planner
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - ./planning:/app/planning:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    command:
      - python3
      - /app/planning/behav-planner.py
      - --ros-args
      - -p
      - goal_radius:=17.0
      - -p
      - goal_theta:=0.0
      - -p
      - goal_delta:=0.0
      - -p
      - publish_to_motors:=true
      - -p
      - camera_fx:=554.25
      - -p
      - camera_fy:=554.25
      - -p
      - camera_cx:=320.0
      - -p
      - camera_cy:=240.0
      - -p
      - camera_height:=0.35
      - --remap
      - /odom_lidar:=/robot1/odom
      - --remap
      - /camera/color/image_raw:=/robot1/camera/image_raw
      - --remap
      - /mcu/command/manual_twist:=/robot1/cmd_vel
      - --remap
      - /scan:=/robot1/scan
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f behav-planner.py > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Shared Bridge Reader - republishes odom+camera from /shared/ into Humble ROS2
  # Runs as its own service to avoid shell scripting issues (no behav_start.sh)
  bridge_reader:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: behav_bridge_reader
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./docker/shared_bridge_reader.py:/app/shared_bridge_reader.py:ro
      - shared_bridge:/shared  # rw: also writes cmd_vel.json for go2_sim relay
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    command: ["python3", "/app/shared_bridge_reader.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f shared_bridge_reader.py > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # BehAV Director - Orchestration node (decomposes instruction → drives planner)
  # Override instruction/goal at runtime:
  #   docker exec -it behav_director python3 /app/planning/behav-director.py -i
  # Or set BEHAV_INSTRUCTION in your .env file.
  director:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: behav_director
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./config:/app/config:ro
      - ./planning:/app/planning:ro
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    stdin_open: true
    tty: true
    command: >
      python3 /app/planning/behav-director.py
      --wait
      --goal-radius ${BEHAV_GOAL_RADIUS:-17.0}
      --goal-theta ${BEHAV_GOAL_THETA:-0.0}
      --goal-delta ${BEHAV_GOAL_DELTA:-0.0}
      --republish-interval 10.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8889/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Foxglove Bridge - exposes all ROS2 topics via WebSocket for Foxglove Studio
  # Open Foxglove Studio → Connect → ws://localhost:8765
  # Download: https://foxglove.dev/download
  foxglove:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: behav_foxglove
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    ports:
      - "8765:8765"
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    command: >
      ros2 launch foxglove_bridge foxglove_bridge_launch.xml
      port:=8765
      address:=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8765' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # RViz2 - Visualize BehAV topics (odom, camera, scan, costmap) on local display
  # Linux only: run `xhost +local:docker` before starting, then:
  #   docker-compose up go2_sim behav bridge_reader director rviz2
  rviz2:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: behav_rviz2
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    command: ros2 run rviz2 rviz2
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f rviz2 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # BehAV Image Viewer - browser-based live view of costmap + trajectory
  # Open http://localhost:8080 in any browser (works on Windows/WSL/Mac)
  viewer:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: behav_viewer
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DIRECTOR_API_URL=http://director:8889
    ports:
      - "8080:8080"
    volumes:
      - ./docker/image_viewer.py:/app/image_viewer.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    command: python3 /app/image_viewer.py
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Landmark Detector - uses FastSAM + GPT-4 Vision to detect the goal landmark
  # and publish its estimated distance as goal_radius to /behav_config
  # Set LANDMARK_IMAGE to the ground-truth image path inside the container
  landmark_detector:
    build:
      context: .
      dockerfile: docker/Dockerfile.behav
    container_name: landmark_detector
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - ./landmark-tracking:/app/landmark-tracking:ro
    depends_on:
      go2_sim:
        condition: service_healthy
    networks:
      - ros2_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f landmark_detector_ROS2.py > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: >
      python3 /app/landmark-tracking/landmark_detector_ROS2.py
      --ros-args
      -p fastsam_model_path:=/app/models/FastSAM-x.pt
      -p image_topic:=/robot1/camera/image_raw
      -p ground_truth_image_path:=${LANDMARK_IMAGE:-Images/Iribe/2.jpg}

  # Instruction Decomposition - Lightweight test service (no ROS2, no GPU)
  # Usage:
  #   docker-compose --profile test run --rm instruction_decomposition --help
  #   docker-compose --profile test run --rm instruction_decomposition --demo
  #   docker-compose --profile test run --rm instruction_decomposition -i
  #   docker-compose --profile test run --rm instruction_decomposition -I "Your instruction"
  instruction_decomposition:
    image: python:3.10-slim
    container_name: instruction_decomposition
    working_dir: /app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./instruction-decomposition:/app/instruction-decomposition:ro
    profiles:
      - test  # Only starts with --profile test
    stdin_open: true   # Required for interactive mode
    tty: true          # Required for interactive mode
    entrypoint:
      - bash
      - -c
      - |
        pip install --quiet openai numpy 2>/dev/null
        exec python /app/instruction-decomposition/GPT4o/instruction-to-behavioral-costs.py "$@"
      - --
    command: ["--help"]

  # Landmark Detection - Standalone test service (CPU version for testing, no ROS2)
  # Note: For production with GPU, use the behav service or modify to use CUDA image
  # Usage:
  #   docker-compose --profile test run --rm landmark_test --help
  #   docker-compose --profile test run --rm landmark_test --demo
  #   docker-compose --profile test run --rm landmark_test -g Images/Testudo/Ground_truth.webp -t Images/Testudo/1.jpg
  landmark_test:
    build:
      context: .
      dockerfile: docker/Dockerfile.landmark
    container_name: landmark_test
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./models:/app/models:ro
      - ./landmark-tracking/Images:/app/landmark-tracking/Images:ro
      - ./output:/app/Image_plots
    profiles:
      - test
    stdin_open: true
    tty: true
    entrypoint:
      - python3
      - /app/landmark-tracking/landmarkdetector_fastsam.py
    command: ["--help"]

networks:
  ros2_net:
    driver: bridge

volumes:
  shared_bridge:
